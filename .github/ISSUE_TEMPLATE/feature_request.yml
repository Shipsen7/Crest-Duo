name: Feature request
description: Propose a user problem Crest could solve.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the user problem and a concrete outcome for Fennavio. Check [the product requirements](https://github.com/Shipsen7/Crest-Duo/blob/main/DUO_PROJECT.md) and support scope first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and where does Crest get in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior you would expect, without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Platform and Space boundaries
      description: Note whether this applies to Mac, iPhone, iPad, extensions, private browsing, or a particular Space workflow.
