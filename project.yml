name: Fennavio
options:
  deploymentTarget:
    iOS: "26.1"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_LANGUAGE: en
targets:
  FennavioNativePreview:
    type: application
    platform: iOS
    sources:
      - path: FennavioNative
        excludes:
          - README.md
          - Configuration
          - Resources
      - path: FennavioNative/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shipsen7.fennavio.native-preview
        INFOPLIST_FILE: FennavioNative/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  FennavioNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FennavioNativeTests
    dependencies:
      - target: FennavioNativePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shipsen7.fennavio.native-preview.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FennavioNativePreview.app/FennavioNativePreview"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FennavioNativePreview:
    build:
      targets:
        FennavioNativePreview: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: FennavioNativeTests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
